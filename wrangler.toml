name = "silvertech-cahier-du-participant"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

# Les fichiers produits par `npm run build` (dossier dist/) sont servis
# par le Worker, qui vérifie d'abord le mot de passe.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
